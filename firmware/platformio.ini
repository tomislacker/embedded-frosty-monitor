; PlatformIO Project Configuration File
;
; frosty-monitor firmware
; Target: ESP32-S3-DevKitC-1 (8MB octal PSRAM)
;
; M0 goal: full task pipeline compiles/links/runs with STUB sensor drivers.
; Real drivers land at M1 bench bring-up.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DFROSTY_DEV_MODE=1
    -std=gnu++17
    ; PubSubClient's default MQTT_MAX_PACKET_SIZE is 256 bytes, which the
    ; aggregate channel/vibration JSON payloads (storage/cloud_aggregate.cpp)
    ; comfortably exceed once more than a couple of channels have data --
    ; PubSubClient silently drops (does not send/truncates) publishes larger
    ; than this buffer, so undersizing it is a silent data-loss bug, not a
    ; loud one. 1024 covers today's channels/vibration aggregate shape with
    ; headroom; see docs/firmware/connectivity.md for the actual payload
    ; sizes this was sized against.
    -DMQTT_MAX_PACKET_SIZE=1024
build_unflags =
    -std=gnu++11
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    knolleary/PubSubClient@^2.8

; Native (host) test environment. Only pure C++ modules (no Arduino deps)
; are compiled here, so we can run Unity tests without hardware.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Isrc
test_build_src = yes
test_filter = test_native
; Only build/test the Arduino-independent sources; everything else in src/
; (HAL stubs, tasks, main.cpp) includes Arduino.h / FreeRTOS headers and is
; intentionally excluded from the native build via src_filter below.
build_src_filter =
    +<storage/record_format.cpp>
    +<storage/cloud_aggregate.cpp>
    +<hal/digital_input.cpp>
    +<hal/leak_sensors.cpp>
